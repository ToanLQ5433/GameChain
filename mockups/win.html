<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pirate Trails — Victory</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Crimson+Pro:wght@400;600&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #1c1410; font-family: 'Crimson Pro', serif; }
.phone { width: 360px; height: 740px; position: relative; overflow: hidden; border-radius: 36px; border: 10px solid #1c1410; box-shadow: 0 30px 70px rgba(0,0,0,.7); background: linear-gradient(180deg, #fff3d6 0%, #f3e3b8 100%); }
.dim { position: absolute; inset: 0; background: rgba(4,7,13,.82); }

.panel { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 304px; background: #f4e8cf; border: 3px solid #f3c64f; border-radius: 18px; padding: 22px 18px 20px; text-align: center; }
.eyebrow { font-family: 'Cinzel', serif; font-size: 10px; font-weight: 700; letter-spacing: 2px; color: #12826c; }
.title { font-family: 'Cinzel', serif; font-size: 15px; font-weight: 900; color: #42281d; margin-top: 4px; }
.stars { margin-top: 32px; font-size: 26px; letter-spacing: 6px; color: #ffc200; text-shadow: 0 0 2px #4a2c11; }
.reward-card { width: 96px; height: 96px; margin: 20px auto 0; background: #fff; border: 2px solid #f3c64f; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 40px; }
.reward-text { font-family: 'Cinzel', serif; font-weight: 900; font-size: 13px; color: #c68a00; margin-top: 12px; }

.btn { display: block; width: 100%; border: none; border-radius: 24px; font-family: 'Cinzel', serif; font-weight: 900; padding: 13px 0; margin-top: 14px; box-shadow: 0 5px 0 rgba(0,0,0,.3); position: relative; }
.btn.gold { background: #f3c64f; color: #2b1e16; font-size: 16px; box-shadow: 0 5px 0 #8a6a10; }
.btn.gold.claim { font-size: 13px; }
.btn.ink { background: #3d2b1f; color: #f4e8cf; font-size: 14px; box-shadow: 0 5px 0 #1a120c; }
</style>
</head>
<body>
<div class="phone">
  <div class="dim"></div>
  <div class="panel">
    <div class="eyebrow">VICTORY!</div>
    <div class="title">Basics 1: Double Chain 3x4</div>
    <div class="stars">★★☆</div>
    <div class="reward-card">🧭</div>
    <div class="reward-text">+30 Coins (⚡+10)</div>
    <button class="btn gold claim">📺 CLAIM x2 REWARD</button>
    <button class="btn gold">NEXT ⏩</button>
    <button class="btn ink">HOME 🏠</button>
  </div>
</div>
</body>
</html>
