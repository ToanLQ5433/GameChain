<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pirate Trails — Rescue Offer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Crimson+Pro:wght@400;600&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
body { height: 100vh; width: 100vw; margin: 0; display: flex; align-items: center; justify-content: center; background: #1c1410; font-family: 'Crimson Pro', serif; overflow: hidden; }
.phone { width: min(360px, 94vw); height: min(740px, 94vh); aspect-ratio: 360 / 740; position: relative; overflow: hidden; border-radius: 36px; border: 10px solid #1c1410; box-shadow: 0 30px 70px rgba(0,0,0,.7); background: linear-gradient(180deg, #fff3d6 0%, #f3e3b8 100%); }
.dim { position: absolute; inset: 0; background: rgba(4,7,13,.82); }

.panel { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 310px; background: #fff0ee; border: 3px solid #a82e2e; border-radius: 18px; padding: 22px 20px 20px; text-align: center; }
.title { font-family: 'Cinzel', serif; font-size: 20px; font-weight: 900; color: #b91c1c; }
.msg { font-size: 11px; color: #42281d; margin-top: 14px; }
.countdown { font-family: 'Cinzel', serif; font-weight: 900; font-size: 12px; color: #b91c1c; margin-top: 14px; }

.btn { display: block; width: 100%; border: none; border-radius: 23px; font-family: 'Cinzel', serif; font-weight: 900; font-size: 11px; padding: 12px 0; margin-top: 12px; box-shadow: 0 4px 0 rgba(0,0,0,.3); }
.btn.gold { background: #f3c64f; color: #2b1e16; box-shadow: 0 4px 0 #8a6a10; }
.btn.teal { background: #14b8a6; color: #fff; box-shadow: 0 4px 0 #0a4c4f; }
.btn.ink { background: #3d2b1f; color: #f4e8cf; box-shadow: 0 4px 0 #1a120c; }
</style>
</head>
<body>
<div class="phone">
  <div class="dim"></div>
  <div class="panel">
    <div class="title">💥 Oh No!</div>
    <div class="msg">💥 Touched a Bomb — push a Crate into it next time.</div>
    <div class="countdown">Auto-declining in 5s</div>
    <button class="btn gold">📺 Watch Ad — Retry Free</button>
    <button class="btn teal">🟡 20 Coins — Retry Free</button>
    <button class="btn ink">No Thanks</button>
  </div>
</div>
</body>
</html>
