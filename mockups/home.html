<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pirate Trails — Home</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Crimson+Pro:wght@400;600&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
body { height: 100vh; width: 100vw; margin: 0; display: flex; align-items: center; justify-content: center; background: #1c1410; font-family: 'Crimson Pro', serif; overflow: hidden; }
.phone { width: min(360px, 94vw); height: min(740px, 94vh); aspect-ratio: 360 / 740; position: relative; overflow: hidden; border-radius: 36px; border: 10px solid #1c1410; box-shadow: 0 30px 70px rgba(0,0,0,.7); background: linear-gradient(180deg, #4cb3ec 0%, #1c7dc4 100%); }

/* decorative background blobs */
.blob { position: absolute; border-radius: 50%; background: #4ade80; }
.cloud { position: absolute; border-radius: 999px; background: #fff; }

/* top bar clusters */
.cluster { position: absolute; top: 16px; display: flex; align-items: center; height: 36px; }
.cluster-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; border: 4px solid; z-index: 2; position: relative; }
.cluster-pill { height: 32px; background: #fff1de; border: 4px solid #16a5ff; border-radius: 16px; display: flex; align-items: center; padding: 0 14px; margin-left: -18px; font-family: 'Cinzel', serif; font-weight: 900; font-size: 13px; color: #996150; }
.badge { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; background: #ef4444; border: 2px solid #fff; color: #fff; font-family: 'Cinzel', serif; font-size: 10px; font-weight: 900; display: flex; align-items: center; justify-content: center; }
.buy-btn { width: 24px; height: 24px; border-radius: 50%; background: #67ee07; border: 3px solid #2f8c04; margin-left: 4px; display: flex; align-items: center; justify-content: center; color: #d5ffb8; font-weight: 900; font-size: 14px; z-index: 2; }

.gear-btn { position: absolute; top: 16px; right: 14px; width: 48px; height: 48px; border-radius: 14px; background: #0284c7; border: 3px solid #0369a1; box-shadow: 0 4px 0 #0369a1; display: flex; align-items: center; justify-content: center; font-size: 22px; }

/* event/quest bar */
.event-bar { position: absolute; top: 68px; left: 16px; right: 16px; height: 26px; background: #f4e8cf; border: 3px solid #3d2b1f; border-radius: 13px; display: flex; align-items: center; padding: 0 8px; gap: 8px; }
.event-track { flex: 1; height: 14px; background: #e2e8f0; border: 1.5px solid #3d2b1f; border-radius: 7px; overflow: hidden; }
.event-fill { width: 0%; height: 100%; background: #14b8a6; }
.event-label { font-family: 'Cinzel', serif; font-weight: 900; font-size: 12px; color: #2b1e16; }

/* map */
.map { position: absolute; top: 102px; bottom: 160px; left: 0; right: 0; overflow: hidden; }
.road { position: absolute; width: 18px; background: #4a2c11; }
.road.locked { background: #6b4423; opacity: .55; }
.node { position: absolute; width: 84px; height: 84px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Cinzel', serif; font-weight: 900; font-size: 26px; color: #fff; transform: translate(-50%, -50%); }
.node.locked { background: #7a5230; border: 4px solid #442711; font-size: 28px; }
.node.current { width: 104px; height: 104px; background: #ffc200; border: 5px solid #c68a00; color: #2b1e16; box-shadow: 0 0 0 12px rgba(255,194,0,.2); }
.node.done { background: #22c55e; border: 4px solid #15803d; }
.diff-badge { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; border: 2px solid #fff; }
.boat { position: absolute; top: -30px; left: 50%; transform: translateX(-50%); font-size: 30px; }

/* side offer cards */
.offer-card { position: absolute; top: 220px; width: 68px; }
.offer-box { width: 68px; height: 68px; border-radius: 16px; border: 4px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 5px 0 rgba(43,30,22,.35); position: relative; }
.offer-chip { margin-top: 4px; height: 22px; background: #36324c; border: 2px solid #975e55; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-family: 'Cinzel', serif; font-weight: 900; font-size: 9px; color: #fff9f4; }
.ads-stamp { position: absolute; font-family: 'Cinzel', serif; font-weight: 900; font-size: 22px; color: #fff1de; transform: rotate(-14deg); text-shadow: 0 3px 4px rgba(0,0,0,.4); }

/* CTA */
.cta { position: absolute; bottom: 132px; left: 50%; transform: translateX(-50%); width: 260px; height: 62px; background: linear-gradient(180deg, #22c55e, #16a34a); border: 6px solid #e7ccb1; border-radius: 20px; box-shadow: 0 6px 0 #14532d; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.cta .lvl { font-family: 'Cinzel', serif; font-weight: 900; font-size: 22px; color: #fef2d4; text-shadow: 0 0 3px #14532d; letter-spacing: 1px; }

/* bottom dock — side panels 84px tall, center podium 104px (20px taller);
   buttons are positioned with a `top` offset INSIDE their own panel so the
   icon+label always sit with clear margin from both the panel's rounded
   top edge and the phone's bottom edge, instead of poking above the panel
   or crowding the very corner. */
.dock { position: absolute; bottom: 0; left: 0; right: 0; height: 84px; }
.dock-side { position: absolute; bottom: 0; width: 112px; height: 84px; background: #fee1b9; border: 5px solid #e7ccb1; border-bottom: none; }
.dock-side.left { left: 0; border-radius: 28px 0 0 0; }
.dock-side.right { right: 0; border-radius: 0 28px 0 0; }
.dock-center { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 136px; height: 104px; background: #fff1de; border: 5px solid #e7ccb1; border-bottom: none; border-radius: 28px 28px 0 0; }
.dock-btn { position: absolute; top: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.dock-btn.center { top: -8px; }
.dock-icon { width: 46px; height: 46px; border-radius: 14px; background: #fff; border: 3px solid #3d2b1f; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.dock-icon.active { width: 58px; height: 58px; background: #f3c64f; font-size: 26px; }
.dock-label { font-family: 'Cinzel', serif; font-weight: 900; font-size: 9px; color: #36324c; }
</style>
</head>
<body>
<div class="phone">
  <div class="blob" style="width:62px;height:38px;top:118px;left:12px;opacity:.22;"></div>
  <div class="blob" style="width:70px;height:42px;top:296px;right:14px;opacity:.22;"></div>
  <div class="blob" style="width:52px;height:32px;top:606px;left:16px;opacity:.22;"></div>
  <div class="cloud" style="width:56px;height:20px;top:59px;right:56px;opacity:.35;"></div>
  <div class="cloud" style="width:66px;height:22px;top:252px;left:36px;opacity:.35;"></div>
  <div class="cloud" style="width:48px;height:16px;top:488px;right:24px;opacity:.35;"></div>

  <!-- Top bar -->
  <div class="cluster" style="left:6px;">
    <div class="cluster-icon" style="background:#ffd94d;border-color:#c9971f;">🪙</div>
    <div class="cluster-pill">1234<div class="buy-btn">+</div></div>
  </div>
  <div class="cluster" style="left:132px;">
    <div class="cluster-icon" style="background:#ff8a8a;border-color:#c23b3b;">❤️<div class="badge">5</div></div>
    <div class="cluster-pill" style="color:#0369a1;">19:19<div class="buy-btn">+</div></div>
  </div>
  <div class="gear-btn">⚙️</div>

  <div class="event-bar">
    <span style="font-size:13px;">🏆</span>
    <div class="event-track"><div class="event-fill" style="width:33%;"></div></div>
    <div class="event-label">1/3</div>
  </div>

  <!-- Map -->
  <div class="map">
    <div class="road" style="top:20px; left:180px; height:150px;"></div>
    <div class="road locked" style="top:170px; left:210px; height:150px;"></div>
    <div class="road locked" style="top:320px; left:140px; height:150px;"></div>

    <div class="node locked" style="top:80px; left:180px;">🔒</div>
    <div class="node current" style="top:230px; left:210px;">
      12
      <div class="boat">⛵</div>
      <div class="diff-badge" style="background:#7c3aed;top:0;right:0;">💀</div>
    </div>
    <div class="node done" style="top:380px; left:140px;">✓</div>
    <div class="node done" style="top:530px; left:190px;">✓</div>
  </div>

  <!-- Side offers -->
  <div class="offer-card" style="left:14px;">
    <div class="offer-box" style="background:#f3c64f;">📅<div class="badge" style="top:-6px;right:-6px;">•</div></div>
    <div class="offer-chip">Daily</div>
  </div>
  <div class="offer-card" style="right:14px;">
    <div class="offer-box" style="background:#f43f5e;"><span class="ads-stamp">ADS</span></div>
    <div class="offer-chip">No Ads</div>
  </div>

  <!-- CTA -->
  <div class="cta"><div class="lvl">Level 12</div></div>

  <!-- Bottom dock -->
  <div class="dock">
    <div class="dock-side left"></div>
    <div class="dock-side right"></div>
    <div class="dock-center"></div>
    <div class="dock-btn" style="left:56px;"><div class="dock-icon">🏪</div><div class="dock-label">SHOP</div></div>
    <div class="dock-btn center" style="left:50%; transform:translateX(-50%);"><div class="dock-icon active">🏠</div><div class="dock-label">HOME</div></div>
    <div class="dock-btn" style="right:56px; transform:translateX(50%);"><div class="dock-icon">🔒</div><div class="dock-label">SOON</div></div>
  </div>
</div>
</body>
</html>
